# Release workflow: runs when a tag like v0.1.0 is pushed.
#
# Jobs:
#   publish-crate   publishes the `arabic-normalize` crate to crates.io (secret CARGO_REGISTRY_TOKEN)
#   wheels          builds abi3 wheels (manylinux x86_64/aarch64, macOS x86_64/arm64, Windows x64)
#   sdist           builds the source distribution
#   publish-pypi    uploads both to PyPI as `arabic-normalize` by trusted publishing (environment `pypi`)

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish-crate:
    name: Publish arabic-normalize to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the tag matches the crate version
        shell: bash
        run: |
          version=$(cargo pkgid -p arabic-normalize | sed 's/.*[#@]//')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match arabic-normalize version $version in Cargo.toml"
            exit 1
          fi
      - name: Test
        run: cargo test --locked -p arabic-normalize
      - name: Publish
        run: cargo publish --locked -p arabic-normalize
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  wheels:
    name: Wheel ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { name: linux-aarch64, runner: ubuntu-latest, target: aarch64, manylinux: auto }
          - { name: macos-x86_64, runner: macos-14, target: x86_64-apple-darwin, manylinux: "" }
          - { name: macos-arm64, runner: macos-14, target: aarch64-apple-darwin, manylinux: "" }
          - { name: windows-x86_64, runner: windows-latest, target: x64, manylinux: "" }
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist -m python/Cargo.toml
          sccache: "true"
      - name: Smoke test the wheel
        if: matrix.platform.name == 'linux-x86_64' || matrix.platform.name == 'macos-arm64' || matrix.platform.name == 'windows-x86_64'
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist arabic-normalize
          python python/tests/test_smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m python/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish-pypi:
    name: Publish arabic-normalize to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
