[package]
name = "arabic-normalize-py"
version = "0.1.0"
edition = "2021"
authors = ["Abdeldjalil Chougui"]
license = "MIT"
description = "Python bindings for arabic-normalize"
publish = false

[lib]
name = "arabic_normalize"
crate-type = ["cdylib"]

[dependencies]
arabic-normalize = { path = "..", version = "0.1.0" }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py39"] }
